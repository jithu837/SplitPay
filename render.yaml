# ============================================================
# Render Blueprint — SplitPay Backend
# Docs: https://render.com/docs/blueprint-spec
# ============================================================

services:
  - type: web
    name: splitpay-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    healthCheckPath: /actuator/health

    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # ── CORS ─────────────────────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://frontend-zeta-drab-tzb04en7pk.vercel.app,*"
      - key: SPRING_MAIL_HOST
        value: "smtp.gmail.com"
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: RESEND_API_KEY
        sync: false
